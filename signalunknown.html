<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PathWeaver</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background-color: #fcfcfc;
            color: #333;
        }
        #story-text p {
            margin-bottom: 1.2em;
        }
        #choices {
            margin-top: 20px;
        }
        button {
            display: block;
            margin: 10px 0;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            text-align: left;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.4;
        }
        button:hover {
            background: #f0f0f0;
            border-color: #999;
        }
    </style>
</head>
<body>

    <!-- Target container converted to a div to hold paragraph blocks dynamically -->
    <div id="story-text"></div>
    <div id="choices"></div>

    <script>
        const storyData = {
            start: {
                text: "It is 2047.\n\nFor the first time in human history, a signal has been detected coming from outside the Solar System.\n\nIt isn't random noise. It repeats **every 17 minutes, 42 seconds.**\n\nThe signal has been named **UNKNOWN-01.**\n\nYou are **in charge** of the first team assigned to investigate it.\n\nAfter several days of analysis, your team finally manages to decode a small section.\n\nThe message contains only three words:\n\n**\"DO NOT ANSWER.**\"\n\nThe room goes silent.\n\nWhat do you think?",
                choices: [
                    { text: "**Continue decoding the signal.**\nYou want to know who sent it and why.", nextNode: "decodeSignal" },
                    { text: "**Stop the experiment.**\nIf the message is genuine, answering could be dangerous.", nextNode: "stopExperiment" },
                    { text: "**Send a simple response.**\nMaybe whoever sent the signal can explain what the message means.", nextNode: "respondSignal" }
                ]
            },
            decodeSignal: {
                text: "**You continue processing the signal.**\n\nThe computers work for **several hours** before another section becomes readable.\n\nA new message appears:\n\n**\"IT HEARS YOU.\"**\n\nBefore anyone can react, the signal **changes again.**\n\nA **sequence of numbers** begins repeating.\n\nYour computer identifies them as **coordinates.**\n\nYou enter them into the astronomical database.\n\n**Nothing appears.**\n\n**No planet.**\n\n**No star.**\n\n**No known object.**\n\nJust **empty space.**",
                choices: [
                    { text: "**Investigate the coordinates.**\nMaybe this is a location to meet, or wherever the signal was sent from.", nextNode: "investigateCoordinates" },
                    { text: "**Continue decoding the signal**\nThere might be  answers to your questions.", nextNode: "decodeMore" },
                    { text: "**Tell the public about UNKNOWN-01.**\nThis might be an international threat, the public should know.", nextNode: "tellPublic" }
                ]
            },
            investigateCoordinates: {
                text: "You route deep-space sensors to the coordinates.\n\nAt first, there is nothing. Then, a distortion in light occurs. Something massive is masking its presence, waiting.",
                choices: [{ text: "Play Again", nextNode: "start" }]
            },
            decodeMore: {
                text: "The deeper your team decodes, the weirder it gets. It is not an audio or text file; it is an uploaded map of our defense networks.",
                choices: [{ text: "Play Again", nextNode: "start" }]
            },
            tellPublic: {
                text: "The news leaks globally. Panic spreads instantly, but a unified planetary defense protocol is established immediately.",
                choices: [{ text: "Play Again", nextNode: "start" }]
            },
            stopExperiment: {
                text: "You power down the arrays. The room plunges into a heavy silence, leaving the mystery unresolved.",
                choices: [{ text: "Play Again", nextNode: "start" }]
            },
            respondSignal: {
                text: "You broadcast a baseline ping back into space. Minutes pass. Then, the console warnings light up in sequence.",
                choices: [{ text: "Play Again", nextNode: "start" }]
            }
        };

        // Complete rewrite of text engine to ensure native browser text nodes parse cleanly
        function renderSafeText(container, rawText, username = "") {
            container.textContent = "";
            if (!rawText) return;
            
            let dynamicText = rawText.replace(/{name}/g, username);

            const appendMarkdown = (element, text) => {
                const parts = text.split(/(\*\*.*?\*\*)/g);
                parts.forEach(part => {
                    if (part.startsWith("**") && part.endsWith("**")) {
                        const strong = document.createElement("strong");
                        strong.textContent = part.slice(2, -2);
                        element.appendChild(strong);
                    } else if (part) {
                        element.appendChild(document.createTextNode(part));
                    }
                });
            };

            // Buttons cannot contain block <p> elements structurally 
            if (container.tagName.toLowerCase() === "button") {
                appendMarkdown(container, dynamicText);
            } else {
                const lines = dynamicText.split("\n\n");
                lines.forEach(line => {
                    if (!line.trim()) return;
                    const p = document.createElement("p");
                    appendMarkdown(p, line);
                    container.appendChild(p);
                });
            }
        }

        function dataScreen(nodeKey) {
            const currentNode = storyData[nodeKey];
            if (!currentNode) {
                console.error("Missing node mapping for key: ", nodeKey);
                return;
            }

            const storyContainer = document.getElementById("story-text");
            renderSafeText(storyContainer, currentNode.text);

            const choicesContainer = document.getElementById("choices");
            choicesContainer.textContent = "";

            currentNode.choices.forEach(choice => {
                const button = document.createElement("button");
                renderSafeText(button, choice.text);
                button.onclick = () => dataScreen(choice.nextNode);
                choicesContainer.appendChild(button);
            });
        }

        // Initialize state engine cleanly on window resource load completion
        window.addEventListener("DOMContentLoaded", () => {
            dataScreen("start");
        });
    </script>
</body>
</html>
